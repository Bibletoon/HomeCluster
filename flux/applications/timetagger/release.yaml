apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: timetagger
    namespace: timetagger
spec:
    interval: 10m
    chart:
        spec:
            chart: timetagger
            version: '2.3.1'
            sourceRef:
                kind: HelmRepository
                name: christianhuth
                namespace: timetagger
            interval: 1h
    values:
        ingress:
            enabled: true
            className: traefik
            hosts:
                - host: blog.bibletoon.xyz
                  paths:
                      - path: /
        persistence:
            enabled: true
            storageClassName: longhorn
        auth:
            existingSecret: timetagger-auth
